name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Check the built stylesheet is up to date
        run: |
          npm run build:css
          git diff --exit-code -- tailwind.css \
            || (echo "tailwind.css is stale: run 'npm run build:css' and commit the result" && exit 1)

      - name: Run the browser tests
        run: npm test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/shots/
          if-no-files-found: ignore
